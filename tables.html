<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
    <link rel="stylesheet" href="static/css/style.css">
</head>
<body>
    <h1>Tables in HTML</h1>
    <p>Tables are used to display data in a tabular format. 
        They consist of rows and columns, and can be styled
         using CSS.</p>

    <table >
        <tr>
            <th>country</th>
            <th>capital</th>
            <th>population</th>
        </tr>
        <tr>
            <td>kenya</td>
            <td>nairobi</td>
            <td>54 million</td>
        </tr>
        <tr>
            <td>uganda</td>
            <td>kampala</td>
            <td>45 million</td>
        </tr>
        <tr>
            <td>botswana</td>
            <td>gaborone</td>
            <td>2.3 million</td>
        </tr>
        <tr>
            <td>tanzania</td>
            <td>dodoma</td>
            <td>61 million</td>
        </tr>
        <tr>
            <td>rwanda</td>
            <td>kigali</td>
            <td>13 million</td>
        </tr>
    </table>

    
</body>
</html>
